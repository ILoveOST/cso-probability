# 카스온라인 확률 자동 업데이트 + 사이트 배포
# - 20분마다(매시 7분·27분·47분) 공식 확률 페이지를 확인합니다.
#   (정각은 GitHub이 붐벼서 피했고, 그래도 몇 분 늦거나 가끔 한 번 건너뛸 수 있습니다)
# - 바뀐 내용이 있으면 js/data.js 와 변동 이력 js/history.js 를 고쳐 저장하고 사이트를 다시 올립니다.
# - 바뀐 게 없으면 사이트 재배포는 건너뜁니다.
# - nexon-now/ 폴더에 넥슨 NOW 저장 파일을 올리면(push) 자동으로 분석해서 js/nexonnow.js 로 반영합니다.
# - Actions 탭에서 "Run workflow" 버튼으로 바로 실행할 수도 있습니다.
name: 확률 자동 업데이트

on:
  schedule:
    - cron: '7,27,47 * * * *'   # 20분마다
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 공식 확률 페이지 확인
        id: update
        if: github.event_name != 'push'
        run: |
          pip install --quiet requests
          python scripts/update_data.py

      - name: 넥슨 NOW 저장 파일 반영
        id: nownx
        run: |
          if ls -A nexon-now/ | grep -qv '^README.md$'; then
            pip install --quiet requests
            python scripts/import_nexon_now.py
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "올린 넥슨 NOW 파일 없음"
          fi

      - name: 바뀐 내용 저장
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "확률 데이터 자동 업데이트 ($(TZ=Asia/Seoul date '+%F %H:%M'))"
            git pull --rebase --quiet
            git push
          else
            echo "변경 없음"
          fi

      - name: 사이트 파일 모으기
        id: build
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true' || steps.nownx.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp -r index.html css js images _site/

      - uses: actions/configure-pages@v5
        if: steps.build.outcome == 'success'
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outcome == 'success'
        with:
          path: _site
      - name: 사이트 배포
        id: deploy
        if: steps.build.outcome == 'success'
        uses: actions/deploy-pages@v4
