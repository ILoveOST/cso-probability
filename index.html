<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카스온라인 해독기 확률 도감</title>
<meta name="description" content="카운터스트라이크 온라인 해독기 16종의 아이템별 확률을 무기 이미지와 함께 보기 쉽게 정리했습니다.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#" aria-label="처음으로">
      <span class="brand-mark">CSO</span>
      <span class="brand-text">해독기 확률 도감</span>
    </a>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="아이템 검색  (예: SKULL-7, 스컬7, ㅋㅅㅌㅅ)" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <label class="switch" title="모든 해독기에서 검색">
      <input id="allDec" type="checkbox">
      <span class="switch-ui"></span>
      <span class="switch-label">전체 해독기</span>
    </label>
    <button class="tb-btn" id="histBtn" title="확률 변경 기록">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>변경 기록</span>
    </button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="해독기 목록"></aside>

  <main class="content">
    <div class="mobile-picker">
      <label for="decSelect">해독기</label>
      <select id="decSelect"></select>
    </div>

    <section class="hero" id="hero"></section>

    <div class="toolbar" id="toolbar">
      <div class="seg" id="typeSeg" role="group" aria-label="종류">
        <button data-v="all" class="on">전체</button>
        <button data-v="weapon">무기</button>
        <button data-v="class">클래스</button>
        <button data-v="etc">기타</button>
      </div>
      <div class="seg" id="periodSeg" role="group" aria-label="기간">
        <button data-v="all" class="on">모든 기간</button>
        <button data-v="perm">무제한</button>
        <button data-v="temp">기간제</button>
      </div>
      <div class="toolbar-right">
        <select id="sort" aria-label="정렬">
          <option value="group">그룹별</option>
          <option value="desc">확률 높은 순</option>
          <option value="asc">확률 낮은 순</option>
          <option value="name">이름 순</option>
        </select>
        <div class="seg icon-seg" id="viewSeg" role="group" aria-label="보기 방식">
          <button data-v="card" class="on" title="카드로 보기"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
          <button data-v="list" title="목록으로 보기"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg></button>
        </div>
      </div>
    </div>

    <div class="activefilters" id="activeFilters"></div>
    <div id="results"></div>

    <footer class="foot">
      <p>확률 출처: <a href="https://csonline.nexon.com/Probability/Index?id=9616" target="_blank" rel="noopener">카운터스트라이크 온라인 공식 확률형 아이템 페이지</a> · <span id="updated"></span> 기준 · 공식 표기는 소수점 다섯째 자리까지입니다.</p>
      <p>무기 이미지 출처: <a href="https://cso.fandom.com/" target="_blank" rel="noopener">Counter-Strike Online Wiki</a> · 기간제·강화·파츠·[ZHC] 표기 아이템은 기본 무기 이미지를 사용합니다.</p>
      <p>확률은 공식 페이지를 20분마다 자동으로 확인해 바뀌면 반영합니다. 찜 목록·가격은 이 브라우저에만 저장됩니다. <span id="lastChanges"></span></p>
      <p id="nowInfo"></p>
      <p>공식 표에서 그룹명이 밀리거나 비어 있는 경우(예: 이벤트 해독기) 아이템 기준으로 바로잡아 표시합니다.</p>
    </footer>
  </main>
</div>

<dialog id="detail" aria-labelledby="dTitle"></dialog>
<dialog id="histDlg" class="hist-dlg" aria-labelledby="hTitle"></dialog>

<script src="js/data.js"></script>
<script src="js/history.js"></script>
<script src="js/nexonnow.js"></script>
<script src="js/app.js"></script>
</body>
</html>
